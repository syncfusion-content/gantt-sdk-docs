<!DOCTYPE html>
<html lang="en">
    <head>
        <title>EJ2 Gantt</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Typescript Gantt Controls" />
        <meta name="author" content="Syncfusion" />
        <link href="index.css" rel="stylesheet" />
        <link href="https://cdn.syncfusion.com/ej2/34.1.29/tailwind3.css" rel="stylesheet" type="text/css"/>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/systemjs/0.19.38/system.js"></script>
        <script src="systemjs.config.js"></script>
    </head>
    <body>
      <div id='loader'>Loading....</div>
        <div id="container">
          <div id="configPanel" class="config-panel">
            <div class="config-group">
              <div class="config-item">
                <label for="daysPerWeek">Days per Week:</label>
                <input type="number" id="daysPerWeek" min="1" max="7" value="5">
              </div>
              <div class="config-item">
                <label for="daysPerMonth">Days per Month:</label>
                <input type="number" id="daysPerMonth" min="1" max="31" value="20">
              </div>
              <button id="updateButton" class="update-button">Update</button>
            </div>
          </div>
          <div id="Gantt"></div>
        </div>
        <script>
            var ele = document.getElementById('container');
            if(ele) {
                ele.style.visibility = "visible";
            }
        </script>
    </body>
</html>
