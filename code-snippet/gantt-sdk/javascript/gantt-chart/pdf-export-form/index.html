<!DOCTYPE html>
<html lang="en">

<head>
    <title>EJ2 Gantt</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Typescript Gantt Controls">
    <meta name="author" content="Syncfusion">
    <link href="index.css" rel="stylesheet">
    <link href="https://cdn.syncfusion.com/ej2/34.1.29/tailwind3.css" rel="stylesheet" type="text/css">
    <script src="https://cdn.syncfusion.com/ej2/34.1.29/dist/ej2.min.js" type="text/javascript"></script>
    <script src="es5-datasource.js" type="text/javascript"></script>
    <style>
        .form-container {
            max-width: 400px;
            margin-bottom: 20px;
        }

        .e-float-input {
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <div id='container'>
        <div class="form-container">
            <form id="formComponent">
                <div class="e-input-group">
                    <input class="e-input" id="name" type="text" placeholder=" " required />
                    <span class="e-float-text">Name</span>
                </div>

                <div class="e-input-group">
                    <input class="e-input" id="email" type="email" placeholder=" " required />
                    <span class="e-float-text">Email</span>
                </div>

                <div class="e-input-group">
                    <textarea class="e-input" id="message" rows="2" placeholder=" "></textarea>
                    <span class="e-float-text">Message</span>
                </div>
            </form>
        </div>
        <div id="GanttExport"></div>
    </div>
    <script>
        var ele = document.getElementById('container');
        if (ele) {
            ele.style.visibility = "visible";
        }   
    </script>
    <script src="index.js" type="text/javascript"></script>
</body>

</html>
