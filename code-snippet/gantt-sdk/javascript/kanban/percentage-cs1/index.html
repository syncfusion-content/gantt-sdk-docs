<!DOCTYPE html>
<html lang="en">

<head>
    <title>Set Kanban Height and Width on Percentage</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Kanban height and width to percentage">
    <meta name="author" content="Syncfusion">
    <link href="index.css" rel="stylesheet">
    <link href="https://unpkg.com/@syncfusion/ej2-tailwind3-theme@35.1.43/styles/kanban/index.css" rel="stylesheet" />
    <script src="https://cdn.syncfusion.com/ej2/35.1.43/dist/ej2.min.js" type="text/javascript"></script>
    <script src="es5-datasource.js" type="text/javascript"></script>
</head>

<body>

    <div id="container">
        <div class="content-wrapper">
            <div id="Kanban"></div>
        </div>
    </div>


    <script>
        var ele = document.getElementById('container');
        if (ele) {
            ele.style.visibility = "visible";
        }   
    </script>
    <script src="index.js" type="text/javascript"></script>
</body>

</html>
